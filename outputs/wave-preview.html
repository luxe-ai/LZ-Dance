<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>立体动作搭子 · Wave 动效预览</title>
  <style>
    :root { color-scheme:dark; --paper:#f5f2e9; --muted:#96938b; --gold:#f1ad32; --cyan:#b7e8ef; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden; background:#0b0c0d; color:var(--paper); font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; }
    .shell { width:min(1160px,calc(100vw - 40px)); display:grid; grid-template-columns:minmax(0,1fr) 310px; gap:22px; }
    .stage-card,.notes { background:#151617; border:1px solid #2c2e30; border-radius:24px; }
    .stage-card { overflow:hidden; box-shadow:0 30px 90px rgba(0,0,0,.42); }
    .stage-head { height:72px; padding:0 24px; display:flex; align-items:center; gap:14px; border-bottom:1px solid #292b2d; }
    .stage-head strong { font-size:17px; }
    .stage-head span { color:var(--gold); font-size:11px; letter-spacing:.08em; }
    .stage-head small { margin-left:auto; color:var(--muted); font-size:10px; }
    .stage { position:relative; height:min(670px,calc(100vh - 150px)); min-height:540px; display:grid; place-items:center; overflow:hidden; isolation:isolate; background:radial-gradient(circle at 44% 40%,#293139 0,#17191b 43%,#0e0f10 78%); }
    .halo { position:absolute; width:470px; height:470px; border-radius:50%; background:radial-gradient(circle at 35% 28%,rgba(183,232,239,.16),rgba(64,85,94,.06) 44%,transparent 70%); border:1px solid rgba(183,232,239,.07); transform:translateY(-12px); }
    .floor { position:absolute; bottom:72px; width:390px; height:78px; border-radius:50%; background:radial-gradient(ellipse,rgba(0,0,0,.66),rgba(0,0,0,.15) 58%,transparent 72%); filter:blur(4px); animation:floor-breathe 4.8s ease-in-out infinite; }
    .sprite-wrap { position:relative; z-index:2; width:min(560px,82%); aspect-ratio:1; animation:actor-weight 4.8s cubic-bezier(.36,.08,.2,1) infinite; filter:drop-shadow(0 28px 24px rgba(0,0,0,.38)); }
    .sprite { width:100%; height:100%; background-image:url("original-companion-3d-wave-sprites-v1.png"); background-repeat:no-repeat; background-size:200% 200%; background-position:0 0; animation:wave-frames 4.8s steps(1,end) infinite; }
    .glint { position:absolute; z-index:3; width:10px; height:10px; border-radius:50%; background:#ffd77b; box-shadow:0 0 18px #f1ad32; opacity:0; transform:translate(190px,-140px); animation:glint 4.8s ease-in-out infinite; }
    .arc { position:absolute; z-index:1; width:170px; height:116px; border:3px solid transparent; border-top-color:rgba(241,173,50,.76); border-radius:50%; top:116px; left:calc(50% + 92px); opacity:0; transform:rotate(15deg); animation:arc 4.8s ease-in-out infinite; }
    .paused * { animation-play-state:paused !important; }
    .slow * { animation-duration:7.2s !important; }
    @keyframes wave-frames {
      0%,12%,92%,100% { background-position:0 0; }
      18%,34%,70%,83% { background-position:100% 0; }
      40%,53% { background-position:100% 100%; }
      59%,65% { background-position:100% 0; }
    }
    @keyframes actor-weight {
      0%,100% { transform:translateY(10px) rotate(0) scale(1.01,.98); }
      13% { transform:translate(-5px,16px) rotate(-1deg) scale(1.025,.965); }
      25% { transform:translate(2px,-4px) rotate(.5deg) scale(.99,1.015); }
      46% { transform:translate(-2px,-7px) rotate(-.7deg) scale(.992,1.018); }
      62% { transform:translate(4px,-3px) rotate(.7deg) scale(.995,1.012); }
      80% { transform:translate(-2px,2px) rotate(-.3deg) scale(1,1); }
    }
    @keyframes floor-breathe { 0%,100%{transform:scaleX(1);opacity:.75} 14%{transform:scaleX(1.06);opacity:.9} 28%,65%{transform:scaleX(.94);opacity:.58} }
    @keyframes arc { 0%,15%,88%,100%{opacity:0;transform:rotate(15deg) scale(.82)} 30%,72%{opacity:1;transform:rotate(2deg) scale(1)} }
    @keyframes glint { 0%,28%,74%,100%{opacity:0;transform:translate(190px,-120px) scale(.4)} 42%,63%{opacity:1;transform:translate(200px,-150px) scale(1)} }
    .notes { padding:25px; display:flex; flex-direction:column; }
    .eyebrow { color:var(--cyan); font:700 10px/1 ui-monospace,monospace; letter-spacing:.13em; }
    .notes h1 { margin:14px 0 9px; font-size:26px; letter-spacing:-.045em; }
    .notes>p { margin:0 0 28px; color:var(--muted); font-size:12px; line-height:1.8; }
    .rules { display:grid; gap:17px; }
    .rule { display:grid; grid-template-columns:29px 1fr; gap:10px; }
    .rule b { color:var(--gold); font:700 10px/1.5 ui-monospace,monospace; }
    .rule strong { display:block; margin-bottom:4px; font-size:12px; }
    .rule span { display:block; color:var(--muted); font-size:10px; line-height:1.6; }
    .controls { margin-top:auto; padding-top:26px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    button { min-height:43px; border:1px solid #3a3d40; border-radius:12px; background:#1e2022; color:var(--paper); font:600 11px/1 inherit; cursor:pointer; }
    button:hover { border-color:#7b6231; }
    button.primary { grid-column:1/-1; background:var(--gold); border-color:var(--gold); color:#17130b; }
    @media(max-width:820px){ body{overflow:auto;padding:20px 0}.shell{grid-template-columns:1fr}.stage{height:570px}.notes{min-height:420px}.sprite-wrap{width:min(540px,94%)}} 
    @media(prefers-reduced-motion:reduce){ .stage *{animation:none!important} }
  </style>
</head>
<body>
  <main class="shell">
    <section class="stage-card">
      <header class="stage-head"><strong>立体动作搭子</strong><span>WAVE · 4.8s</span><small>3D 关键帧预览</small></header>
      <div class="stage" id="stage">
        <div class="halo" aria-hidden="true"></div>
        <div class="floor" aria-hidden="true"></div>
        <div class="arc" aria-hidden="true"></div>
        <div class="sprite-wrap" role="img" aria-label="立体动作搭子缓慢挥手，手臂始终远离脸部">
          <div class="sprite"></div>
          <div class="glint" aria-hidden="true"></div>
        </div>
      </div>
    </section>
    <aside class="notes">
      <div class="eyebrow">V4 · VOLUME FIRST</div>
      <h1>先有体积，再做可爱</h1>
      <p>这版不再靠黑色轮廓描人。光影、遮挡和身体重心共同建立立体感，挥手也从脸的外侧经过。</p>
      <div class="rules">
        <div class="rule"><b>01</b><div><strong>手臂离脸远一点</strong><span>挥手轨迹始终在头部轮廓之外，留出明显空气感。</span></div></div>
        <div class="rule"><b>02</b><div><strong>不是平面贴纸</strong><span>身体有暖光、冷边光和自阴影，鞋底也有内部深度。</span></div></div>
        <div class="rule"><b>03</b><div><strong>动作不发呆</strong><span>先压重心，再由肩膀带动手臂，身体会轻微回弹。</span></div></div>
        <div class="rule"><b>04</b><div><strong>Wave 放慢看</strong><span>一轮 4.8 秒，重点看抬手、停顿和回收是否自然。</span></div></div>
      </div>
      <div class="controls"><button class="primary" id="toggle">暂停</button><button id="replay">重新播放</button><button id="speed">放慢到 7.2 秒</button></div>
    </aside>
  </main>
  <script>
    const stage=document.querySelector('#stage');
    const toggle=document.querySelector('#toggle');
    const replay=document.querySelector('#replay');
    const speed=document.querySelector('#speed');
    toggle.onclick=()=>{stage.classList.toggle('paused');toggle.textContent=stage.classList.contains('paused')?'继续播放':'暂停'};
    replay.onclick=()=>location.reload();
    speed.onclick=()=>{stage.classList.toggle('slow');speed.textContent=stage.classList.contains('slow')?'恢复 4.8 秒':'放慢到 7.2 秒'};
  </script>
</body>
</html>
